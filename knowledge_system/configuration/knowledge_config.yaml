# ナレッジベースシステム設定
database:
  path: "knowledge_system/database/knowledge.db"
  backup_interval: 3600  # 1時間ごと

vector_search:
  index_path: "knowledge_system/database/faiss_index/knowledge.index"
  model_name: "paraphrase-multilingual-MiniLM-L12-v2"  # 日本語対応
  embedding_dim: 384
  similarity_threshold: 0.3

migration:
  source_spreadsheet_id: "1qpMLT9HKlPT9qY17fpqOkSIbehKH77wZ8bA1yfPSO_s"
  source_sheet: "actionable_knowledge"
  batch_size: 100

logging:
  level: "INFO"
  file: "knowledge_system/logs/system.log"
