<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="30">
    <title>24時間自律稼働システム - ダッシュボード</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        .status-card {
            background: #2a2a2a;
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        .status-header {
            font-size: 24px;
            color: green;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }
        .metric-label {
            color: #00ff00;
        }
        .metric-value {
            color: #ffffff;
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00aa00);
            transition: width 0.3s;
        }
        .timestamp {
            text-align: center;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 24時間自律稼働システム</h1>
        
        <div class="status-card">
            <div class="status-header">✅ 稼働中</div>
        </div>

        <div class="status-card">
            <h2>📊 API使用状況</h2>
            <div class="metric">
                <span class="metric-label">1分あたり:</span>
                <span class="metric-value">0/15</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 0.0%"></div>
            </div>
            
            <div class="metric" style="margin-top: 15px;">
                <span class="metric-label">1日あたり:</span>
                <span class="metric-value">0/1500</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 0.0%"></div>
            </div>
        </div>

        <div class="status-card">
            <h2>💾 ディスク使用状況</h2>
            <div class="metric">
                <span class="metric-label">使用量:</span>
                <span class="metric-value">12.2GB / 31.3GB</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 41.0%"></div>
            </div>
            <div class="metric" style="margin-top: 15px;">
                <span class="metric-label">使用率:</span>
                <span class="metric-value">41.0%</span>
            </div>
        </div>

        <div class="status-card">
            <h2>🧠 メモリ使用状況</h2>
            <div class="metric">
                <span class="metric-label">使用量:</span>
                <span class="metric-value">1.7GB / 7.8GB</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 22.4%"></div>
            </div>
            <div class="metric" style="margin-top: 15px;">
                <span class="metric-label">使用率:</span>
                <span class="metric-value">22.4%</span>
            </div>
        </div>

        <div class="timestamp">
            最終更新: 2025-11-22 03:26:02<br>
            30秒ごとに自動更新
        </div>
    </div>
</body>
</html>
