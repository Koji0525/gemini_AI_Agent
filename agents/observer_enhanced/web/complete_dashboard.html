<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Observer - 完全版ダッシュボード</title>
    
    <!-- CDN読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .dashboard-container {
            max-width: 1800px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .health-score {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .grade-A { background: #10b981; color: white; }
        .grade-B { background: #3b82f6; color: white; }
        .grade-C { background: #f59e0b; color: white; }
        .grade-D { background: #ef4444; color: white; }
        .grade-F { background: #991b1b; color: white; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        #dependency-graph {
            width: 100%;
            height: 600px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
        }
        
        .alert-item {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-critical { background: #fee2e2; border-left: 4px solid #ef4444; }
        .alert-high { background: #fef3c7; border-left: 4px solid #f59e0b; }
        .alert-medium { background: #dbeafe; border-left: 4px solid #3b82f6; }
        .alert-low { background: #d1fae5; border-left: 4px solid #10b981; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .node {
            cursor: pointer;
        }
        
        .node circle {
            stroke: #fff;
            stroke-width: 2px;
        }
        
        .node text {
            font-size: 12px;
            pointer-events: none;
        }
        
        .link {
            fill: none;
            stroke: #999;
            stroke-opacity: 0.6;
        }
        
        .timeline-container {
            width: 100%;
            height: 300px;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // メインダッシュボードコンポーネント
        function Dashboard() {
            const [systemHealth, setSystemHealth] = useState(null);
            const [dependencyGraph, setDependencyGraph] = useState(null);
            const [recentTraces, setRecentTraces] = useState([]);
            const [alerts, setAlerts] = useState([]);
            const [hiddenDeps, setHiddenDeps] = useState(null);
            const [changeImpact, setChangeImpact] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            
            const graphRef = useRef(null);
            const timelineRef = useRef(null);
            
            // データ取得
            useEffect(() => {
                fetchAllData();
                const interval = setInterval(fetchAllData, 5000); // 5秒ごと更新
                return () => clearInterval(interval);
            }, []);
            
            async function fetchAllData() {
                try {
                    const [health, graph, traces, alertsData, hidden, impact] = await Promise.all([
                        fetch('/api/health').then(r => r.json()),
                        fetch('/api/dependency-graph').then(r => r.json()),
                        fetch('/api/traces/recent').then(r => r.json()),
                        fetch('/api/alerts').then(r => r.json()),
                        fetch('/api/hidden-dependencies').then(r => r.json()),
                        fetch('/api/change-impact').then(r => r.json())
                    ]);
                    
                    setSystemHealth(health);
                    setDependencyGraph(graph);
                    setRecentTraces(traces);
                    setAlerts(alertsData);
                    setHiddenDeps(hidden);
                    setChangeImpact(impact);
                    setLoading(false);
                    setError(null);
                } catch (err) {
                    setError(`データ取得失敗: ${err.message}`);
                    setLoading(false);
                }
            }
            
            // 依存関係グラフの描画
            useEffect(() => {
                if (!dependencyGraph || !graphRef.current) return;
                
                const width = graphRef.current.clientWidth;
                const height = graphRef.current.clientHeight;
                
                // 既存のSVGをクリア
                d3.select(graphRef.current).selectAll("*").remove();
                
                const svg = d3.select(graphRef.current)
                    .append("svg")
                    .attr("width", width)
                    .attr("height", height);
                
                const simulation = d3.forceSimulation(dependencyGraph.nodes)
                    .force("link", d3.forceLink(dependencyGraph.edges)
                        .id(d => d.id)
                        .distance(100))
                    .force("charge", d3.forceManyBody().strength(-300))
                    .force("center", d3.forceCenter(width / 2, height / 2));
                
                const link = svg.append("g")
                    .selectAll("line")
                    .data(dependencyGraph.edges)
                    .enter()
                    .append("line")
                    .attr("class", "link")
                    .attr("stroke-width", 2);
                
                const node = svg.append("g")
                    .selectAll("g")
                    .data(dependencyGraph.nodes)
                    .enter()
                    .append("g")
                    .attr("class", "node")
                    .call(d3.drag()
                        .on("start", dragstarted)
                        .on("drag", dragged)
                        .on("end", dragended));
                
                node.append("circle")
                    .attr("r", d => d.type === 'agent' ? 20 : 15)
                    .attr("fill", d => {
                        switch(d.type) {
                            case 'agent': return '#667eea';
                            case 'tool': return '#10b981';
                            default: return '#f59e0b';
                        }
                    });
                
                node.append("text")
                    .attr("dx", 25)
                    .attr("dy", 5)
                    .text(d => d.id);
                
                simulation.on("tick", () => {
                    link
                        .attr("x1", d => d.source.x)
                        .attr("y1", d => d.source.y)
                        .attr("x2", d => d.target.x)
                        .attr("y2", d => d.target.y);
                    
                    node.attr("transform", d => `translate(${d.x},${d.y})`);
                });
                
                function dragstarted(event, d) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                }
                
                function dragged(event, d) {
                    d.fx = event.x;
                    d.fy = event.y;
                }
                
                function dragended(event, d) {
                    if (!event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }
            }, [dependencyGraph]);
            
            // タイムライン描画
            useEffect(() => {
                if (!recentTraces.length || !timelineRef.current) return;
                
                const ctx = timelineRef.current.getContext('2d');
                
                // 既存のチャートを破棄
                if (window.timelineChart) {
                    window.timelineChart.destroy();
                }
                
                const labels = recentTraces.map(t => new Date(t.timestamp).toLocaleTimeString('ja-JP'));
                const successData = recentTraces.map(t => t.status === 'success' ? 1 : 0);
                const errorData = recentTraces.map(t => t.status === 'error' ? 1 : 0);
                
                window.timelineChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '成功',
                                data: successData,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                tension: 0.4
                            },
                            {
                                label: 'エラー',
                                data: errorData,
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                tension: 0.4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 1
                            }
                        }
                    }
                });
            }, [recentTraces]);
            
            if (loading) {
                return (
                    <div className="dashboard-container">
                        <div className="card loading">
                            <div className="spinner"></div>
                            <p>データ読み込み中...</p>
                        </div>
                    </div>
                );
            }
            
            if (error) {
                return (
                    <div className="dashboard-container">
                        <div className="error">
                            <h2>エラー</h2>
                            <p>{error}</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="dashboard-container">
                    {/* ヘッダー */}
                    <div className="header">
                        <h1>🔍 Enhanced Observer - 完全版ダッシュボード</h1>
                        <p>
                            システムヘルス: 
                            <span className={`health-score grade-${systemHealth?.grade || 'F'}`}>
                                {systemHealth?.grade || 'N/A'} ({systemHealth?.score || 0}点)
                            </span>
                            <span style={{marginLeft: '20px', color: '#666'}}>
                                稼働時間: {systemHealth?.uptime || '不明'}
                            </span>
                        </p>
                    </div>
                    
                    {/* 統計カード */}
                    <div className="card">
                        <h2>📊 システム統計</h2>
                        <div className="stats-grid">
                            <div className="stat-item">
                                <div className="stat-value">{systemHealth?.agents_alive || 0}</div>
                                <div className="stat-label">稼働エージェント</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{systemHealth?.test_success_rate || 0}%</div>
                                <div className="stat-label">テスト成功率</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{recentTraces.length}</div>
                                <div className="stat-label">直近トレース</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{alerts.length}</div>
                                <div className="stat-label">アラート</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{hiddenDeps?.total || 0}</div>
                                <div className="stat-label">隠れた依存</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{changeImpact?.affected_components || 0}</div>
                                <div className="stat-label">影響範囲</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* グリッドレイアウト */}
                    <div className="grid">
                        {/* 依存関係グラフ */}
                        <div className="card full-width">
                            <h2>🔗 依存関係グラフ</h2>
                            <div id="dependency-graph" ref={graphRef}></div>
                        </div>
                        
                        {/* タイムライン */}
                        <div className="card full-width">
                            <h2>📈 実行トレース タイムライン</h2>
                            <div className="timeline-container">
                                <canvas ref={timelineRef}></canvas>
                            </div>
                        </div>
                        
                        {/* アラート */}
                        <div className="card">
                            <h2>⚠️ アラート ({alerts.length}件)</h2>
                            {alerts.length === 0 ? (
                                <p style={{color: '#10b981', textAlign: 'center', padding: '20px'}}>
                                    ✅ アラートはありません
                                </p>
                            ) : (
                                alerts.map((alert, idx) => (
                                    <div key={idx} className={`alert-item alert-${alert.level}`}>
                                        <strong>{alert.component}</strong>: {alert.message}
                                    </div>
                                ))
                            )}
                        </div>
                        
                        {/* 隠れた依存関係 */}
                        <div className="card">
                            <h2>🔍 隠れた依存関係</h2>
                            {hiddenDeps && (
                                <div>
                                    <p><strong>ファイルI/O:</strong> {hiddenDeps.file_io || 0}箇所</p>
                                    <p><strong>環境変数:</strong> {hiddenDeps.env_vars || 0}箇所</p>
                                    <p><strong>外部コマンド:</strong> {hiddenDeps.external_commands || 0}箇所</p>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    {/* 変更影響分析 */}
                    {changeImpact && (
                        <div className="card">
                            <h2>📋 変更影響分析</h2>
                            <p><strong>最終変更:</strong> {changeImpact.last_change}</p>
                            <p><strong>影響コンポーネント:</strong> {changeImpact.affected_components}個</p>
                            <p><strong>推奨テスト:</strong> {changeImpact.recommended_tests}件</p>
                        </div>
                    )}
                </div>
            );
        }
        
        // レンダリング
        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
