<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依存関係可視化ダッシュボード v1.0</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <header class="py-3 mb-4 border-bottom">
            <div class="d-flex align-items-center">
                <h1 class="h3 me-auto">🔍 依存関係可視化ダッシュボード</h1>
                <span class="badge bg-success">Phase 1完了</span>
            </div>
        </header>

        <!-- ナビゲーションタブ -->
        <ul class="nav nav-tabs mb-4" id="dashboardTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" 
                        data-bs-target="#overview" type="button">
                    �� 概要
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="duplicates-tab" data-bs-toggle="tab" 
                        data-bs-target="#duplicates" type="button">
                    📁 重複検出
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="impact-tab" data-bs-toggle="tab" 
                        data-bs-target="#impact" type="button">
                    🎯 影響範囲
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="search-tab" data-bs-toggle="tab" 
                        data-bs-target="#search" type="button">
                    🔎 ファイル検索
                </button>
            </li>
        </ul>

        <!-- タブコンテンツ -->
        <div class="tab-content" id="dashboardTabsContent">
            <!-- 概要タブ -->
            <div class="tab-pane fade show active" id="overview" role="tabpanel">
                <div class="row">
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">総ファイル数</h5>
                                <p class="display-4" id="total-files">-</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">重複ファイル</h5>
                                <p class="display-4 text-warning" id="duplicate-count">-</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">高リスクファイル</h5>
                                <p class="display-4 text-danger" id="high-risk-count">-</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">シェルスクリプト</h5>
                                <p class="display-4" id="shell-count">282</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 重複検出タブ -->
            <div class="tab-pane fade" id="duplicates" role="tabpanel">
                <h4>🔍 重複ファイルグループ</h4>
                <div id="duplicates-content">
                    <p class="text-muted">読み込み中...</p>
                </div>
            </div>

            <!-- 影響範囲タブ -->
            <div class="tab-pane fade" id="impact" role="tabpanel">
                <h4>🎯 影響範囲分析</h4>
                <div class="mb-3">
                    <input type="text" class="form-control" id="impact-file-input" 
                           placeholder="ファイルパスを入力 (例: agents/pm_agent.py)">
                    <button class="btn btn-primary mt-2" onclick="analyzeImpact()">分析開始</button>
                </div>
                <div id="impact-result"></div>
            </div>

            <!-- ファイル検索タブ -->
            <div class="tab-pane fade" id="search" role="tabpanel">
                <h4>🔎 ファイル検索</h4>
                <input type="text" class="form-control mb-3" id="file-search-input" 
                       placeholder="ファイル名を入力..." onkeyup="searchFiles()">
                <div id="search-results"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/dashboard.js"></script>
</body>
</html>
