<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Observer Dashboard</title>
    <style>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           CSS スタイリング（P2-006）
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* ヘッダー */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #666;
        }
        
        .last-update {
            font-size: 0.9em;
            color: #888;
        }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* グリッドレイアウト */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        /* カード基本スタイル */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-icon {
            font-size: 1.5em;
        }
        
        /* ヘルススコアカード（P2-002） */
        .health-score {
            text-align: center;
            padding: 30px;
        }
        
        .score-circle {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            position: relative;
        }
        
        .score-circle.grade-a { background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); color: white; }
        .score-circle.grade-b { background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); color: white; }
        .score-circle.grade-c { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); color: white; }
        .score-circle.grade-d { background: linear-gradient(135deg, #fb923c 0%, #f97316 100%); color: white; }
        .score-circle.grade-f { background: linear-gradient(135deg, #f87171 0%, #ef4444 100%); color: white; }
        
        .grade-label {
            font-size: 0.4em;
            margin-top: 10px;
            opacity: 0.9;
        }
        
        .component-scores {
            margin-top: 20px;
            text-align: left;
        }
        
        .component-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .component-name {
            color: #666;
            font-size: 0.9em;
        }
        
        .component-score {
            font-weight: bold;
            color: #667eea;
        }
        
        /* アラートリスト（P2-003） */
        .alert-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .alert-item {
            padding: 15px;
            border-left: 4px solid #ddd;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f9fafb;
            transition: all 0.3s ease;
        }
        
        .alert-item:hover {
            background: #f3f4f6;
            transform: translateX(5px);
        }
        
        .alert-item.level-info { border-left-color: #60a5fa; }
        .alert-item.level-warning { border-left-color: #fbbf24; }
        .alert-item.level-error { border-left-color: #f87171; }
        .alert-item.level-critical { border-left-color: #dc2626; }
        
        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .alert-title {
            font-weight: bold;
            color: #333;
        }
        
        .alert-time {
            font-size: 0.8em;
            color: #888;
        }
        
        .alert-message {
            color: #666;
            font-size: 0.9em;
        }
        
        .no-alerts {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        /* トレースログテーブル（P2-004） */
        .trace-table-container {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .trace-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .trace-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .trace-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }
        
        .trace-table tr:hover {
            background: #f9fafb;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .status-success { background: #d1fae5; color: #065f46; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .status-pending { background: #fef3c7; color: #92400e; }
        
        .no-traces {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        /* ローディング */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* レスポンシブ */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .score-circle {
                width: 150px;
                height: 150px;
                font-size: 2.5em;
            }
        }
    
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           Phase 3: グラフ可視化スタイル
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        
        .graph-controls {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .graph-controls label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        .control-button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .control-button:hover {
            background: #5568d3;
        }
        
        .graph-stats {
            margin-left: auto;
            color: #666;
            font-size: 0.9em;
        }
        
        #graphContainer {
            width: 100%;
            height: 600px;
            background: #f9fafb;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        #graphContainer svg {
            width: 100%;
            height: 100%;
        }
        
        /* ノード詳細パネル */
        .node-detail-panel {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 350px;
            max-height: 80vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            z-index: 1000;
            overflow: hidden;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #667eea;
            color: white;
        }
        
        .panel-header h3 {
            margin: 0;
            font-size: 1.2em;
        }
        
        .close-button {
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s ease;
        }
        
        .close-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .panel-content {
            padding: 20px;
            max-height: calc(80vh - 70px);
            overflow-y: auto;
        }
        
        .detail-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .detail-item:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .detail-value {
            color: #666;
        }
        
        /* グラフノード/エッジのスタイル */
        .graph-node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .graph-node:hover {
            stroke-width: 3px;
        }
        
        .graph-node.selected {
            stroke: #f59e0b;
            stroke-width: 4px;
        }
        
        .graph-link {
            stroke: #999;
            stroke-opacity: 0.6;
            stroke-width: 1.5px;
        }
        
        .graph-link.highlighted {
            stroke: #667eea;
            stroke-opacity: 1;
            stroke-width: 3px;
        }
        
        .graph-label {
            font-size: 10px;
            pointer-events: none;
            user-select: none;
        }

    
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           Phase 4: メトリクスダッシュボードスタイル
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .metric-item {
            background: #f9fafb;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .metric-item:hover {
            transform: translateY(-3px);
            background: #f3f4f6;
        }
        
        .metric-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }
        
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .metric-value.warning {
            color: #f59e0b;
        }
        
        .metric-value.critical {
            color: #ef4444;
        }
        
        .metric-unit {
            font-size: 0.5em;
            color: #999;
        }
        
        .metric-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .metric-bar-fill {
            height: 100%;
            transition: width 0.5s ease;
        }
        
        .metric-bar-fill.healthy {
            background: linear-gradient(90deg, #4ade80, #22c55e);
        }
        
        .metric-bar-fill.warning {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }
        
        .metric-bar-fill.critical {
            background: linear-gradient(90deg, #f87171, #ef4444);
        }
        
        .performance-status {
            padding: 15px;
            text-align: center;
        }
        
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
            margin: 15px 0;
        }
        
        .status-badge.healthy {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
        }
        
        .status-badge.warning {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: white;
        }
        
        .status-badge.critical {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: white;
        }
        
        .issues-list {
            margin-top: 15px;
            text-align: left;
        }
        
        .issue-item {
            padding: 10px;
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        
        .warning-item {
            background: #fef3c7;
            border-left-color: #f59e0b;
        }

    
        /* エクスポートボタン */
        .export-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .export-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.5);
        }
        
        .export-btn:active {
            transform: translateY(0);
        }

    </style>
</head>
<body>

        <!-- エクスポートボタン -->
        <div class="export-controls" style="margin: 20px 0;">
            <button onclick="exportData('traces')" class="export-btn">
                📥 トレースエクスポート
            </button>
            <button onclick="exportData('graph')" class="export-btn">

            </button>

            </button>
        </div>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>🔍 Enhanced Observer Dashboard</h1>
            <div class="header-info">
                <div class="last-update">
                    最終更新: <span id="lastUpdate">読み込み中...</span>
                </div>
                <div class="auto-refresh">

                </div>

        <div class="dashboard-grid">
            <!-- ヘルススコアカード（P2-002） -->
            <div class="card">

            <!-- システムメトリクスカード（P4-004） -->
            <div class="card">
                <div class="card-title">
                    <span class="card-icon">⚡</span>
                    システムメトリクス
                </div>
                <div id="metricsCard" class="loading">
                    <div class="spinner"></div>

            <!-- パフォーマンスステータスカード（P4-004） -->
            <div class="card">

        <!-- 依存関係グラフ可視化（P3-001〜007） -->
        <div class="card" style="grid-column: 1 / -1;">

                </label>

                </label>
                <button id="resetGraph" class="control-button">リセット</button>
                <span id="graphStats" class="graph-stats"></span>
            </div>
            
            <!-- グラフ表示エリア -->
            <div id="graphContainer" class="loading">
                <div class="spinner"></div>
                <p>グラフデータ読み込み中...</p>

            <!-- ノード詳細パネル（P3-006） -->
            <div id="nodeDetailPanel" class="node-detail-panel" style="display: none;">
                <div class="panel-header">
                    <h3 id="nodeDetailTitle">ノード詳細</h3>
                    <button id="closeDetailPanel" class="close-button">×</button>
                </div>
                <div id="nodeDetailContent" class="panel-content"></div>
            </div>
        </div>

        </div>
    </div>

    
    <!-- D3.js CDN（P3-001） -->
    <script src="https://d3js.org/d3.v7.min.js">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // エクスポート機能
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        function exportData(type) {
            let url;
            
            switch(type) {
                case 'traces':
                    url = '/api/export/traces?format=json&hours=24';
                    break;
                case 'graph':
                    url = '/api/export/graph?format=json';
                    break;
                case 'alerts':
                    url = '/api/export/alerts?format=json&days=7';
                    break;
                default:
                    console.error('Unknown export type:', type);
                    return;
            }
            
            window.location.href = url;
            console.log('Export started:', type);
        }

    </script>
    
    <script>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           Phase 3: グラフ可視化JavaScript
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        
        let graphData = null;
        let simulation = null;
        let svg = null;
        let selectedNode = null;
        
        // グラフデータの読み込みと変換（P3-002）
        async function loadGraph() {
            try {
                const response = await fetch(`${API_BASE}/graph?limit=100`);
                const data = await response.json();
                graphData = data.graph;
                
                // データ変換: ノードIDをインデックスに変換
                const nodeMap = new Map();
                graphData.nodes.forEach((node, index) => {
                    nodeMap.set(node.id, index);
                    node.type = node.type || 'module'; // デフォルトタイプ
                });
                
                // エッジのsource/targetをインデックスに変換
                graphData.edges = graphData.edges.map(edge => ({
                    source: nodeMap.get(edge.source),
                    target: nodeMap.get(edge.target),
                    type: edge.type || 'imports'
                })).filter(edge => edge.source !== undefined && edge.target !== undefined);
                
                renderGraph();
                updateGraphStats();
            } catch (error) {
                document.getElementById('graphContainer').innerHTML = `
                    <div class="no-alerts">エラー: ${error.message}</div>
                `;
            }
        }
        
        // グラフの描画（P3-003, P3-004）
        function renderGraph() {
            const container = document.getElementById('graphContainer');
            container.innerHTML = '';
            
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            // SVG作成
            svg = d3.select('#graphContainer')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            // ズーム機能（P3-005）
            const zoom = d3.zoom()
                .scaleExtent([0.1, 10])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
            const g = svg.append('g');
            
            // 力学モデルシミュレーション
            simulation = d3.forceSimulation(graphData.nodes)
                .force('link', d3.forceLink(graphData.edges).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));
            
            // エッジ描画（P3-004）
            const link = g.append('g')
                .selectAll('line')
                .data(graphData.edges)
                .enter().append('line')
                .attr('class', 'graph-link')
                .attr('stroke-width', 1.5);
            
            // ノード描画（P3-003）
            const node = g.append('g')
                .selectAll('circle')
                .data(graphData.nodes)
                .enter().append('circle')
                .attr('class', 'graph-node')
                .attr('r', 8)
                .attr('fill', d => getNodeColor(d.type))
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .call(d3.drag()
                    .on('start', dragStarted)
                    .on('drag', dragged)
                    .on('end', dragEnded))
                .on('click', showNodeDetail); // P3-006
            
            // ノードラベル
            const label = g.append('g')
                .selectAll('text')
                .data(graphData.nodes)
                .enter().append('text')
                .attr('class', 'graph-label')
                .attr('dx', 12)
                .attr('dy', 4)
                .text(d => d.label || d.id.split('/').pop());
            
            // シミュレーション更新
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);
                
                label
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });
        }
        
        // ノードタイプ別の色
        function getNodeColor(type) {
            const colors = {
                'module': '#60a5fa',
                'function': '#34d399',
                'class': '#f472b6',
                'file': '#a78bfa',
                'default': '#94a3b8'
            };
            return colors[type] || colors.default;
        }
        
        // ドラッグ機能（P3-005）
        function dragStarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // ノード詳細表示（P3-006）
        function showNodeDetail(event, d) {
            selectedNode = d;
            
            // 選択状態の表示
            d3.selectAll('.graph-node').classed('selected', false);
            d3.select(event.target).classed('selected', true);
            
            // 接続されたエッジをハイライト
            d3.selectAll('.graph-link')
                .classed('highlighted', l => l.source === d || l.target === d);
            
            // 詳細パネル表示
            const panel = document.getElementById('nodeDetailPanel');
            const title = document.getElementById('nodeDetailTitle');
            const content = document.getElementById('nodeDetailContent');
            
            title.textContent = d.label || d.id;
            
            let html = `
                <div class="detail-item">
                    <div class="detail-label">ID</div>
                    <div class="detail-value">${d.id}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">タイプ</div>
                    <div class="detail-value">${d.type || 'unknown'}</div>
                </div>
            `;
            
            if (d.dependencies && d.dependencies.length > 0) {
                html += `
                    <div class="detail-item">
                        <div class="detail-label">依存関係 (${d.dependencies.length})</div>
                        <div class="detail-value">${d.dependencies.join('<br>')}</div>
                    </div>
                `;
            }
            
            content.innerHTML = html;
            panel.style.display = 'block';
        }
        
        // 詳細パネルを閉じる
        document.getElementById('closeDetailPanel').addEventListener('click', () => {
            document.getElementById('nodeDetailPanel').style.display = 'none';
            d3.selectAll('.graph-node').classed('selected', false);
            d3.selectAll('.graph-link').classed('highlighted', false);
        });
        
        // フィルタ機能（P3-007）
        function applyFilters() {
            const showModules = document.getElementById('filterModules').checked;
            const showFunctions = document.getElementById('filterFunctions').checked;
            const showClasses = document.getElementById('filterClasses').checked;
            
            if (!graphData) return;
            
            // フィルタ済みノード
            const filteredNodes = graphData.nodes.filter(node => {
                if (node.type === 'module') return showModules;
                if (node.type === 'function') return showFunctions;
                if (node.type === 'class') return showClasses;
                return true;
            });
            
            const nodeIds = new Set(filteredNodes.map(n => n.id));
            
            // フィルタ済みエッジ
            const filteredEdges = graphData.edges.filter(edge => {
                const sourceNode = graphData.nodes[edge.source.index || edge.source];
                const targetNode = graphData.nodes[edge.target.index || edge.target];
                return sourceNode && targetNode && 
                       nodeIds.has(sourceNode.id) && nodeIds.has(targetNode.id);
            });
            
            // 一時データでグラフ再描画
            const tempData = {
                nodes: filteredNodes,
                edges: filteredEdges
            };
            
            const originalData = graphData;
            graphData = tempData;
            renderGraph();
            graphData = originalData;
            
            updateGraphStats();
        }
        
        // グラフ統計更新
        function updateGraphStats() {
            if (!graphData) return;
            
            const stats = document.getElementById('graphStats');
            stats.textContent = `ノード: ${graphData.nodes.length} | エッジ: ${graphData.edges.length}`;
        }
        
        // グラフリセット
        document.getElementById('resetGraph').addEventListener('click', () => {
            document.getElementById('filterModules').checked = true;
            document.getElementById('filterFunctions').checked = true;
            document.getElementById('filterClasses').checked = true;
            loadGraph();
        });
        
        // フィルタ変更イベント
        document.getElementById('filterModules').addEventListener('change', applyFilters);
        document.getElementById('filterFunctions').addEventListener('change', applyFilters);
        document.getElementById('filterClasses').addEventListener('change', applyFilters);
        
        // グラフ初期読み込み
        loadGraph();
    
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // エクスポート機能
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        function exportData(type) {
            let url;
            
            switch(type) {
                case 'traces':
                    url = '/api/export/traces?format=json&hours=24';
                    break;
                case 'graph':
                    url = '/api/export/graph?format=json';
                    break;
                case 'alerts':
                    url = '/api/export/alerts?format=json&days=7';
                    break;
                default:
                    console.error('Unknown export type:', type);
                    return;
            }
            
            window.location.href = url;
            console.log('Export started:', type);
        }

    </script>

    <script>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           JavaScript - データ取得と表示（P2-005 自動リロード含む）
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        
        const API_BASE = '/api';
        
        // ヘルススコアカードの表示
        async function loadHealthScore() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                const health = data.health;
                
                const gradeClass = `grade-${health.grade.toLowerCase()}`;
                
                let html = `
                    <div class="health-score">
                        <div class="score-circle ${gradeClass}">
                            <div>${health.overall_score.toFixed(1)}</div>
                            <div class="grade-label">Grade: ${health.grade}</div>
                        </div>
                        <div class="component-scores">
                `;
                
                for (const [key, value] of Object.entries(health.component_scores)) {
                    const displayName = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    html += `
                        <div class="component-item">
                            <span class="component-name">${displayName}</span>
                            <span class="component-score">${value.toFixed(1)}</span>
                        </div>
                    `;
                }
                
                html += `</div></div>`;
                
                document.getElementById('healthCard').innerHTML = html;
            } catch (error) {
                document.getElementById('healthCard').innerHTML = `
                    <div class="no-alerts">エラー: ${error.message}</div>
                `;
            }
        }
        
        // アラートリストの表示
        async function loadAlerts() {
            try {
                const response = await fetch(`${API_BASE}/alerts?limit=10`);
                const data = await response.json();
                const alerts = data.alerts;
                
                if (alerts.length === 0) {
                    document.getElementById('alertList').innerHTML = `
                        <div class="no-alerts">✅ アラートはありません</div>
                    `;
                    return;
                }
                
                let html = '<div class="alert-list">';
                
                for (const alert of alerts) {
                    const levelClass = `level-${alert.level || 'info'}`;
                    const time = new Date(alert.created_at).toLocaleString('ja-JP');
                    
                    html += `
                        <div class="alert-item ${levelClass}">
                            <div class="alert-header">
                                <span class="alert-title">${alert.title}</span>
                                <span class="alert-time">${time}</span>
                            </div>
                            <div class="alert-message">${alert.message}</div>
                        </div>
                    `;
                }
                
                html += '</div>';
                
                document.getElementById('alertList').innerHTML = html;
            } catch (error) {
                document.getElementById('alertList').innerHTML = `
                    <div class="no-alerts">エラー: ${error.message}</div>
                `;
            }
        }
        
        // トレースログテーブルの表示
        async function loadTraces() {
            try {
                const response = await fetch(`${API_BASE}/traces?minutes=10&limit=20`);
                const data = await response.json();
                const traces = data.traces;
                
                if (traces.length === 0) {
                    document.getElementById('traceTable').innerHTML = `
                        <div class="no-traces">トレースログがありません</div>
                    `;
                    return;
                }
                
                let html = `
                    <div class="trace-table-container">
                        <table class="trace-table">
                            <thead>
                                <tr>
                                    <th>時刻</th>
                                    <th>コンポーネント</th>
                                    <th>ステータス</th>
                                    <th>実行時間</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                for (const trace of traces) {
                    const time = new Date(trace.start_time).toLocaleTimeString('ja-JP');
                    const component = trace.component_id || 'Unknown';
                    const status = trace.status || 'success';
                    const duration = trace.duration ? `${trace.duration.toFixed(2)}s` : '-';
                    const statusClass = status === 'success' ? 'status-success' : 
                                       status === 'error' ? 'status-error' : 'status-pending';
                    
                    html += `
                        <tr>
                            <td>${time}</td>
                            <td>${component}</td>
                            <td><span class="status-badge ${statusClass}">${status}</span></td>
                            <td>${duration}</td>
                        </tr>
                    `;
                }
                
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                document.getElementById('traceTable').innerHTML = html;
            } catch (error) {
                document.getElementById('traceTable').innerHTML = `
                    <div class="no-traces">エラー: ${error.message}</div>
                `;
            }
        }
        
        // 最終更新時刻の更新
        function updateLastUpdateTime() {
            const now = new Date().toLocaleString('ja-JP');
            document.getElementById('lastUpdate').textContent = now;
        }
        
        // 全データを読み込み
        async function loadAllData() {
            updateLastUpdateTime();
            await Promise.all([
                loadHealthScore(),
                loadAlerts(),
                loadTraces(),
                loadMetrics(),
                loadPerformanceStatus()
            ]);
        }
        
        // 初回読み込み
        loadAllData();
        
        // 10秒ごとに自動更新（P2-005）
        setInterval(loadAllData, 10000);
    
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // エクスポート機能
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        function exportData(type) {
            let url;
            
            switch(type) {
                case 'traces':
                    url = '/api/export/traces?format=json&hours=24';
                    break;
                case 'graph':
                    url = '/api/export/graph?format=json';
                    break;
                case 'alerts':
                    url = '/api/export/alerts?format=json&days=7';
                    break;
                default:
                    console.error('Unknown export type:', type);
                    return;
            }
            
            window.location.href = url;
            console.log('Export started:', type);
        }

    </script>
