<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Observer Dashboard</title>
    <style>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           CSS スタイリング（P2-006）
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* ヘッダー */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #666;
        }
        
        .last-update {
            font-size: 0.9em;
            color: #888;
        }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* グリッドレイアウト */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        /* カード基本スタイル */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-icon {
            font-size: 1.5em;
        }
        
        /* ヘルススコアカード（P2-002） */
        .health-score {
            text-align: center;
            padding: 30px;
        }
        
        .score-circle {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            position: relative;
        }
        
        .score-circle.grade-a { background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); color: white; }
        .score-circle.grade-b { background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); color: white; }
        .score-circle.grade-c { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); color: white; }
        .score-circle.grade-d { background: linear-gradient(135deg, #fb923c 0%, #f97316 100%); color: white; }
        .score-circle.grade-f { background: linear-gradient(135deg, #f87171 0%, #ef4444 100%); color: white; }
        
        .grade-label {
            font-size: 0.4em;
            margin-top: 10px;
            opacity: 0.9;
        }
        
        .component-scores {
            margin-top: 20px;
            text-align: left;
        }
        
        .component-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .component-name {
            color: #666;
            font-size: 0.9em;
        }
        
        .component-score {
            font-weight: bold;
            color: #667eea;
        }
        
        /* アラートリスト（P2-003） */
        .alert-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .alert-item {
            padding: 15px;
            border-left: 4px solid #ddd;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f9fafb;
            transition: all 0.3s ease;
        }
        
        .alert-item:hover {
            background: #f3f4f6;
            transform: translateX(5px);
        }
        
        .alert-item.level-info { border-left-color: #60a5fa; }
        .alert-item.level-warning { border-left-color: #fbbf24; }
        .alert-item.level-error { border-left-color: #f87171; }
        .alert-item.level-critical { border-left-color: #dc2626; }
        
        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .alert-title {
            font-weight: bold;
            color: #333;
        }
        
        .alert-time {
            font-size: 0.8em;
            color: #888;
        }
        
        .alert-message {
            color: #666;
            font-size: 0.9em;
        }
        
        .no-alerts {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        /* トレースログテーブル（P2-004） */
        .trace-table-container {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .trace-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .trace-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .trace-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }
        
        .trace-table tr:hover {
            background: #f9fafb;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .status-success { background: #d1fae5; color: #065f46; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .status-pending { background: #fef3c7; color: #92400e; }
        
        .no-traces {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        /* ローディング */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* レスポンシブ */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .score-circle {
                width: 150px;
                height: 150px;
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>🔍 Enhanced Observer Dashboard</h1>
            <div class="header-info">
                <div class="last-update">
                    最終更新: <span id="lastUpdate">読み込み中...</span>
                </div>
                <div class="auto-refresh">
                    <div class="refresh-indicator"></div>
                    <span>10秒ごとに自動更新</span>
                </div>
            </div>
        </div>

        <!-- ダッシュボードグリッド -->
        <div class="dashboard-grid">
            <!-- ヘルススコアカード（P2-002） -->
            <div class="card">
                <div class="card-title">
                    <span class="card-icon">💊</span>
                    システムヘルススコア
                </div>
                <div id="healthCard" class="loading">
                    <div class="spinner"></div>
                    <p>データ読み込み中...</p>
                </div>
            </div>

            <!-- アラートリスト（P2-003） -->
            <div class="card">
                <div class="card-title">
                    <span class="card-icon">🚨</span>
                    最新アラート
                </div>
                <div id="alertList" class="loading">
                    <div class="spinner"></div>
                    <p>データ読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- トレースログテーブル（P2-004） -->
        <div class="card">
            <div class="card-title">
                <span class="card-icon">📊</span>
                最近のトレースログ
            </div>
            <div id="traceTable" class="loading">
                <div class="spinner"></div>
                <p>データ読み込み中...</p>
            </div>
        </div>
    </div>

    <script>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           JavaScript - データ取得と表示（P2-005 自動リロード含む）
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        
        const API_BASE = '/api';
        
        // ヘルススコアカードの表示
        async function loadHealthScore() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                const health = data.health;
                
                const gradeClass = `grade-${health.grade.toLowerCase()}`;
                
                let html = `
                    <div class="health-score">
                        <div class="score-circle ${gradeClass}">
                            <div>${health.overall_score.toFixed(1)}</div>
                            <div class="grade-label">Grade: ${health.grade}</div>
                        </div>
                        <div class="component-scores">
                `;
                
                for (const [key, value] of Object.entries(health.component_scores)) {
                    const displayName = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    html += `
                        <div class="component-item">
                            <span class="component-name">${displayName}</span>
                            <span class="component-score">${value.toFixed(1)}</span>
                        </div>
                    `;
                }
                
                html += `</div></div>`;
                
                document.getElementById('healthCard').innerHTML = html;
            } catch (error) {
                document.getElementById('healthCard').innerHTML = `
                    <div class="no-alerts">エラー: ${error.message}</div>
                `;
            }
        }
        
        // アラートリストの表示
        async function loadAlerts() {
            try {
                const response = await fetch(`${API_BASE}/alerts?limit=10`);
                const data = await response.json();
                const alerts = data.alerts;
                
                if (alerts.length === 0) {
                    document.getElementById('alertList').innerHTML = `
                        <div class="no-alerts">✅ アラートはありません</div>
                    `;
                    return;
                }
                
                let html = '<div class="alert-list">';
                
                for (const alert of alerts) {
                    const levelClass = `level-${alert.level || 'info'}`;
                    const time = new Date(alert.created_at).toLocaleString('ja-JP');
                    
                    html += `
                        <div class="alert-item ${levelClass}">
                            <div class="alert-header">
                                <span class="alert-title">${alert.title}</span>
                                <span class="alert-time">${time}</span>
                            </div>
                            <div class="alert-message">${alert.message}</div>
                        </div>
                    `;
                }
                
                html += '</div>';
                
                document.getElementById('alertList').innerHTML = html;
            } catch (error) {
                document.getElementById('alertList').innerHTML = `
                    <div class="no-alerts">エラー: ${error.message}</div>
                `;
            }
        }
        
        // トレースログテーブルの表示
        async function loadTraces() {
            try {
                const response = await fetch(`${API_BASE}/traces?minutes=10&limit=20`);
                const data = await response.json();
                const traces = data.traces;
                
                if (traces.length === 0) {
                    document.getElementById('traceTable').innerHTML = `
                        <div class="no-traces">トレースログがありません</div>
                    `;
                    return;
                }
                
                let html = `
                    <div class="trace-table-container">
                        <table class="trace-table">
                            <thead>
                                <tr>
                                    <th>時刻</th>
                                    <th>コンポーネント</th>
                                    <th>ステータス</th>
                                    <th>実行時間</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                for (const trace of traces) {
                    const time = new Date(trace.start_time).toLocaleTimeString('ja-JP');
                    const component = trace.component_id || 'Unknown';
                    const status = trace.status || 'success';
                    const duration = trace.duration ? `${trace.duration.toFixed(2)}s` : '-';
                    const statusClass = status === 'success' ? 'status-success' : 
                                       status === 'error' ? 'status-error' : 'status-pending';
                    
                    html += `
                        <tr>
                            <td>${time}</td>
                            <td>${component}</td>
                            <td><span class="status-badge ${statusClass}">${status}</span></td>
                            <td>${duration}</td>
                        </tr>
                    `;
                }
                
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                document.getElementById('traceTable').innerHTML = html;
            } catch (error) {
                document.getElementById('traceTable').innerHTML = `
                    <div class="no-traces">エラー: ${error.message}</div>
                `;
            }
        }
        
        // 最終更新時刻の更新
        function updateLastUpdateTime() {
            const now = new Date().toLocaleString('ja-JP');
            document.getElementById('lastUpdate').textContent = now;
        }
        
        // 全データを読み込み
        async function loadAllData() {
            updateLastUpdateTime();
            await Promise.all([
                loadHealthScore(),
                loadAlerts(),
                loadTraces()
            ]);
        }
        
        // 初回読み込み
        loadAllData();
        
        // 10秒ごとに自動更新（P2-005）
        setInterval(loadAllData, 10000);
    </script>
</body>
</html>
