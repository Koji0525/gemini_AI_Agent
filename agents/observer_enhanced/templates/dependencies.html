<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕸️ システム依存関係マップ</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #graph-container {
            width: 100%;
            height: 600px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background-color: white;
            position: relative;
        }
        .stats-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .category-agent { background-color: #d4edda; }
        .category-tool { background-color: #cce5ff; }
        .category-test { background-color: #fff3cd; }
        .category-script { background-color: #f8d7da; }
        .category-doc { background-color: #e2e3e5; }
        .category-other { background-color: #f8f9fa; }
        .node { cursor: pointer; }
        .node:hover { stroke-width: 3px; }
        .link { stroke: #999; stroke-opacity: 0.6; }
        .tooltip-custom {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🕸️ システム依存関係マップ</span>
            <a href="/" class="btn btn-light btn-sm">📊 ダッシュボードに戻る</a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 統計情報 -->
            <div class="col-md-3">
                <div class="stats-card">
                    <h5>📊 統計情報</h5>
                    <div id="stats-content">
                        <p class="text-muted">スキャン中...</p>
                    </div>
                </div>
                
                <div class="stats-card">
                    <h5>🎨 カテゴリ凡例</h5>
                    <div>
                        <div class="category-badge category-agent">エージェント</div>
                        <div class="category-badge category-tool">ツール</div>
                        <div class="category-badge category-test">テスト</div>
                        <div class="category-badge category-script">スクリプト</div>
                        <div class="category-badge category-doc">ドキュメント</div>
                        <div class="category-badge category-other">その他</div>
                    </div>
                </div>

                <div class="stats-card">
                    <h5>🔍 ファイル検索</h5>
                    <input type="text" id="file-search" class="form-control form-control-sm" placeholder="ファイル名で検索...">
                    <div id="search-results" class="mt-2"></div>
                </div>
            </div>

            <!-- グラフ表示エリア -->
            <div class="col-md-9">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">🌐 依存関係ネットワーク</h5>
                            <button id="btn-rescan" class="btn btn-primary btn-sm">🔄 再スキャン</button>
                        </div>
                        <div id="graph-container"></div>
                        <div id="tooltip" class="tooltip-custom" style="display: none;"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5>📈 Top 10 ファイル</h5>
                        <div class="row">
                            <div class="col-md-6">
                                <h6>最も多くインポートされている</h6>
                                <div id="top-imported"></div>
                            </div>
                            <div class="col-md-6">
                                <h6>最も多くインポートしている</h6>
                                <div id="top-importers"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let graphData = null;
        let simulation = null;

        // D3.jsグラフ描画
        function drawGraph(data) {
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // 既存のSVGをクリア
            d3.select('#graph-container').selectAll('*').remove();

            const svg = d3.select('#graph-container')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // カテゴリごとの色
            const color = d3.scaleOrdinal()
                .domain(['agent', 'tool', 'test', 'script', 'doc', 'other'])
                .range(['#28a745', '#007bff', '#ffc107', '#dc3545', '#6c757d', '#e9ecef']);

            // Force simulation
            simulation = d3.forceSimulation(data.nodes)
                .force('link', d3.forceLink(data.edges).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(20));

            // エッジ描画
            const link = svg.append('g')
                .selectAll('line')
                .data(data.edges)
                .enter().append('line')
                .attr('class', 'link')
                .attr('stroke-width', 1);

            // ノード描画
            const node = svg.append('g')
                .selectAll('circle')
                .data(data.nodes)
                .enter().append('circle')
                .attr('class', 'node')
                .attr('r', d => Math.max(5, Math.min(15, d.imported_by_count * 2)))
                .attr('fill', d => color(d.category))
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended))
                .on('mouseover', showTooltip)
                .on('mouseout', hideTooltip)
                .on('click', showImpact);

            // ラベル描画（主要ノードのみ）
            const label = svg.append('g')
                .selectAll('text')
                .data(data.nodes.filter(d => d.imported_by_count > 2))
                .enter().append('text')
                .text(d => d.label)
                .attr('font-size', 10)
                .attr('dx', 15)
                .attr('dy', 4);

            // シミュレーション更新
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);

                label
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });

            // ドラッグ関数
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            // ツールチップ
            function showTooltip(event, d) {
                const tooltip = document.getElementById('tooltip');
                tooltip.innerHTML = `
                    <strong>${d.label}</strong><br>
                    カテゴリ: ${d.category}<br>
                    インポート数: ${d.imports_count}<br>
                    被インポート数: ${d.imported_by_count}
                `;
                tooltip.style.display = 'block';
                tooltip.style.left = (event.pageX + 10) + 'px';
                tooltip.style.top = (event.pageY - 10) + 'px';
            }

            function hideTooltip() {
                document.getElementById('tooltip').style.display = 'none';
            }

            // 影響範囲表示
            function showImpact(event, d) {
                fetch(`/api/dependencies/impact/${d.id}`)
                    .then(response => response.json())
                    .then(data => {
                        alert(`【影響範囲分析】\nファイル: ${d.label}\n影響を受けるファイル数: ${data.data.impact_count}\n\n直接影響:\n${data.data.directly_affected.join('\n')}`);
                    });
            }
        }

        // 統計情報表示
        function displayStats(stats) {
            let html = `
                <p><strong>総ファイル数:</strong> ${stats.total_files}</p>
                <p><strong>依存関係数:</strong> ${stats.total_dependencies}</p>
                <hr>
                <h6>ファイルタイプ別</h6>
            `;
            for (const [type, count] of Object.entries(stats.by_type)) {
                html += `<p>${type}: ${count}件</p>`;
            }
            document.getElementById('stats-content').innerHTML = html;

            // Top 10表示
            document.getElementById('top-imported').innerHTML = stats.top_imported.map(item => 
                `<div><small>${item.file} (${item.count})</small></div>`
            ).join('');

            document.getElementById('top-importers').innerHTML = stats.top_importers.map(item => 
                `<div><small>${item.file} (${item.count})</small></div>`
            ).join('');
        }

        // スキャン実行
        async function scanDependencies() {
            try {
                const response = await fetch('/api/dependencies/scan');
                const result = await response.json();
                graphData = result.data;
                
                drawGraph(graphData);
                displayStats(graphData.stats);
            } catch (error) {
                console.error('スキャンエラー:', error);
                alert('依存関係のスキャンに失敗しました');
            }
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            scanDependencies();
            
            document.getElementById('btn-rescan').addEventListener('click', scanDependencies);
        });
    </script>
</body>
</html>
