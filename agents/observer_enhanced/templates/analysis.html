<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 問題検出&分析ダッシュボード</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .alert-custom {
            border-left: 4px solid #dc3545;
            background-color: #f8d7da;
        }
        .warning-custom {
            border-left: 4px solid #ffc107;
            background-color: #fff3cd;
        }
        .success-custom {
            border-left: 4px solid #28a745;
            background-color: #d4edda;
        }
        .file-item {
            padding: 10px;
            margin: 5px 0;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }
        .version-badge {
            display: inline-block;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 0.75rem;
        }
        .latest-badge {
            background-color: #28a745;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🔍 問題検出&分析ダッシュボード</span>
            <a href="/" class="btn btn-light btn-sm">📊 メインダッシュボード</a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- サマリーカード -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="text-muted">重複ファイル</h6>
                        <div class="stat-number text-danger" id="duplicateCount">--</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="text-muted">未使用ファイル</h6>
                        <div class="stat-number text-warning" id="unusedCount">--</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="text-muted">再利用可能ツール</h6>
                        <div class="stat-number text-success" id="reusableCount">--</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="text-muted">バージョン管理ファイル</h6>
                        <div class="stat-number text-info" id="versionCount">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 重複ファイル -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">🔴 重複ファイル検出</h5>
                        <p class="text-muted">同じ機能の異なるバージョンが複数存在</p>
                        <div id="duplicateList">
                            <p class="text-muted">読み込み中...</p>
                        </div>
                    </div>
                </div>

                <!-- 未使用ファイル -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">⚠️ 未使用ファイル検出</h5>
                        <p class="text-muted">どこからもインポートされていないファイル</p>
                        <div id="unusedList">
                            <p class="text-muted">読み込み中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 再利用可能ツール -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">✅ 再利用可能ツール</h5>
                        <p class="text-muted">汎用的に使えるが活用されていないツール</p>
                        <div id="reusableList">
                            <p class="text-muted">読み込み中...</p>
                        </div>
                    </div>
                </div>

                <!-- バージョン履歴 -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">📋 バージョン管理履歴</h5>
                        <p class="text-muted">file_version_manager.pyで管理されたファイル</p>
                        <div id="versionList">
                            <p class="text-muted">読み込み中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- アクション推奨 -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">💡 推奨アクション</h5>
                        <div id="recommendations">
                            <p class="text-muted">分析中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 包括的レポート取得
        async function loadReport() {
            try {
                const response = await fetch('/api/analysis/report');
                const result = await response.json();
                const data = result.data;

                // サマリー更新
                document.getElementById('duplicateCount').textContent = Object.keys(data.duplicates).length;
                document.getElementById('unusedCount').textContent = data.unused_files.length;
                document.getElementById('reusableCount').textContent = data.reusable_tools.length;
                document.getElementById('versionCount').textContent = Object.keys(data.version_history).length;

                // 重複ファイル表示
                displayDuplicates(data.duplicates);

                // 未使用ファイル表示
                displayUnused(data.unused_files);

                // 再利用可能ツール表示
                displayReusable(data.reusable_tools);

                // バージョン履歴表示
                displayVersionHistory(data.version_history);

                // 推奨アクション生成
                generateRecommendations(data);

            } catch (error) {
                console.error('レポート取得エラー:', error);
            }
        }

        // 重複ファイル表示
        function displayDuplicates(duplicates) {
            const container = document.getElementById('duplicateList');
            
            if (Object.keys(duplicates).length === 0) {
                container.innerHTML = '<div class="success-custom p-3">✅ 重複ファイルは検出されませんでした</div>';
                return;
            }

            let html = '';
            for (const [baseName, info] of Object.entries(duplicates)) {
                html += `<div class="alert-custom p-3 mb-3">
                    <strong>重複グループ: ${baseName}</strong><br>
                    <small>ファイル数: ${info.count}</small><br>`;
                
                info.files.forEach(file => {
                    const isLatest = file === info.latest;
                    html += `<div class="file-item ${isLatest ? 'border-success' : ''}">
                        ${file} ${isLatest ? '<span class="badge bg-success">最新</span>' : ''}
                    </div>`;
                });
                
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        // 未使用ファイル表示
        function displayUnused(unused) {
            const container = document.getElementById('unusedList');
            
            if (unused.length === 0) {
                container.innerHTML = '<div class="success-custom p-3">✅ 未使用ファイルは検出されませんでした</div>';
                return;
            }

            let html = '<div class="warning-custom p-3 mb-3">';
            html += `<strong>未使用ファイル: ${unused.length}件</strong><br><br>`;
            
            unused.slice(0, 10).forEach(item => {
                html += `<div class="file-item">
                    ${item.file} 
                    <span class="badge bg-secondary">${item.type}</span>
                    <span class="badge bg-info">${(item.size / 1024).toFixed(1)}KB</span>
                </div>`;
            });
            
            if (unused.length > 10) {
                html += `<p class="mt-2 text-muted">他${unused.length - 10}件...</p>`;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        // 再利用可能ツール表示
        function displayReusable(reusable) {
            const container = document.getElementById('reusableList');
            
            if (reusable.length === 0) {
                container.innerHTML = '<p class="text-muted">該当なし</p>';
                return;
            }

            let html = '<div class="success-custom p-3 mb-3">';
            html += `<strong>再利用推奨ツール: ${reusable.length}件</strong><br><br>`;
            
            reusable.slice(0, 5).forEach(item => {
                html += `<div class="file-item">
                    <strong>${item.file}</strong><br>
                    <small>サイズ: ${(item.size / 1024).toFixed(1)}KB | 使用箇所: ${item.imported_by_count}件</small><br>
                    <small class="text-success">${item.description}</small>
                </div>`;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // バージョン履歴表示
        function displayVersionHistory(history) {
            const container = document.getElementById('versionList');
            
            if (Object.keys(history).length === 0) {
                container.innerHTML = '<p class="text-muted">バージョン管理されたファイルなし</p>';
                return;
            }

            let html = '';
            let count = 0;
            for (const [baseName, versions] of Object.entries(history)) {
                if (count >= 5) break;
                
                html += `<div class="mb-3">
                    <strong>${baseName}</strong><br>`;
                
                versions.forEach(v => {
                    const isLatest = v.version === versions[0].version;
                    html += `<span class="version-badge ${isLatest ? 'latest-badge' : ''}">
                        v${String(v.version).padStart(2, '0')}
                    </span>`;
                });
                
                html += '</div>';
                count++;
            }
            
            if (Object.keys(history).length > 5) {
                html += `<p class="text-muted">他${Object.keys(history).length - 5}グループ...</p>`;
            }
            
            container.innerHTML = html;
        }

        // 推奨アクション生成
        function generateRecommendations(data) {
            const container = document.getElementById('recommendations');
            let html = '<ul class="list-group">';

            if (Object.keys(data.duplicates).length > 0) {
                html += `<li class="list-group-item list-group-item-danger">
                    ⚠️ <strong>${Object.keys(data.duplicates).length}件の重複ファイル</strong>を検出しました。
                    最新バージョン以外を削除または_BACKUPへ移動することを推奨します。
                </li>`;
            }

            if (data.unused_files.length > 0) {
                html += `<li class="list-group-item list-group-item-warning">
                    💡 <strong>${data.unused_files.length}件の未使用ファイル</strong>を検出しました。
                    削除またはアーカイブを検討してください。
                </li>`;
            }

            if (data.reusable_tools.length > 0) {
                html += `<li class="list-group-item list-group-item-success">
                    ✨ <strong>${data.reusable_tools.length}件の再利用可能ツール</strong>を発見しました。
                    他のスクリプトからも活用することで開発効率が向上します。
                </li>`;
            }

            if (Object.keys(data.duplicates).length === 0 && data.unused_files.length === 0) {
                html += `<li class="list-group-item list-group-item-success">
                    ✅ システムは良好な状態です。重大な問題は検出されませんでした。
                </li>`;
            }

            html += '</ul>';
            container.innerHTML = html;
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadReport();
        });
    </script>
</body>
</html>
