[pytest]
# Pytest設定 - Phase 6A対応版

# テストディレクトリの除外
norecursedirs = 
    agents/generated
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .cache

# テストファイルのパターン
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# マーカー定義
markers =
    phase6a: Phase 6A tests
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (deselect with '-m "not slow"')
    existing: Existing tests (must maintain 84.3% success)

# 出力設定
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# カバレッジ設定（オプション）
# --cov=agents/task_execution
# --cov-report=html
