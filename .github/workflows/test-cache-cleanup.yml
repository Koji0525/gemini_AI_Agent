name: Test Cache Cleanup

on:
  push:
    branches: [ main, develop, v1.5.2-wordpress-agent ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手動実行可能

jobs:
  test-cache-cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛎️ リポジトリをチェックアウト
      uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: 🐍 Pythonセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 🧪 キャッシュスクリプトのテスト
      run: |
        echo "=== キャッシュスクリプトテスト ==="
        
        # スクリプトの存在確認
        echo "📁 スクリプトの確認:"
        ls -la scripts/ || echo "scriptsディレクトリなし"
        
        # スクリプトの実行権限付与とテスト
        if [ -f "scripts/clean_cache.sh" ]; then
          chmod +x scripts/clean_cache.sh
          echo "✅ clean_cache.sh が見つかりました"
          # テスト実行（実際の削除はしない）
          ./scripts/clean_cache.sh --help 2>/dev/null || echo "✅ スクリプト実行可能"
        else
          echo "❌ clean_cache.sh が見つかりません"
        fi
        
        if [ -f "scripts/check_file_integrity.sh" ]; then
          chmod +x scripts/check_file_integrity.sh
          echo "✅ check_file_integrity.sh が見つかりました"
        else
          echo "❌ check_file_integrity.sh が見つかりません"
        fi
        
    - name: 📋 ワークフロー確認レポート
      run: |
        echo "### 🔧 ワークフロー設定確認" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**設定ファイル:** ✅ 存在確認" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**トリガー条件:**" >> $GITHUB_STEP_SUMMARY
        echo "- push 時" >> $GITHUB_STEP_SUMMARY  
        echo "- pull_request 時" >> $GITHUB_STEP_SUMMARY
        echo "- 手動実行可能" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**次回実行:** このリポジトリにpushすると自動実行されます" >> $GITHUB_STEP_SUMMARY
