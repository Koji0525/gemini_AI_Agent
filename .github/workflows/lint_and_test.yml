# ファイルパス: .github/workflows/lint_and_test.yml
# ✅ 改良版: push と pull_request 両対応、自動テスト＋整形＋静的解析

name: Lint and Test (Auto)

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pytest mypy

      - name: Run Lint (Black)
        run: black --check .

      - name: Run Static Analysis (Flake8)
        run: flake8 .

      - name: Type Check (mypy)
        run: mypy . || true  # ← 型エラーは警告にして止めない

      - name: Run Unit Tests
        run: pytest -v --maxfail=1 --disable-warnings
