name: 🤖 24時間自律開発システム v2.0 (完全統合版)

on:
  workflow_dispatch:
    inputs:
      development_goal:
        description: '開発目標'
        required: true
        type: string
      priority:
        description: '優先度'
        required: false
        default: 'high'
        type: choice
        options:
          - critical
          - high
          - medium
          - low
      goal_type:
        description: 'タイプ'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - maintenance
          - improvement
  
  schedule:
    - cron: '0 */6 * * *'

jobs:
  autonomous_development:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - name: 📥 チェックアウト
        uses: actions/checkout@v3
      
      - name: 🐍 Python環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 依存関係
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🧹 キャッシュクリア
        run: ./sh/clean_cache.sh
      
      - name: 🔑 認証設定
        run: |
          echo "SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" >> .env
          echo "WP_URL=${{ secrets.WP_URL }}" >> .env
          echo "WP_USER=${{ secrets.WP_USER }}" >> .env
          echo "WP_PASS=${{ secrets.WP_PASS }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > service_account.json
      
      - name: 🎯 目標登録（手動実行時）
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/goal_input_agent_v01_initial.py \
            --goal "${{ github.event.inputs.development_goal }}" \
            --priority "${{ github.event.inputs.priority }}" \
            --type "${{ github.event.inputs.goal_type }}"
      
      - name: 🚀 自律開発サイクル実行
        run: |
          python3 scripts/integrated_orchestrator_v02_full_integration.py \
            --max-duration 330
      
      - name: 📊 結果サマリー
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏁 実行完了: $(date)"
          echo "🔄 次回: 6時間後（自動）"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
