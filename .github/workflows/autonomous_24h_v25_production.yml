name: 🤖 24時間自律開発システム v25（本番）

on:
  workflow_dispatch:
    inputs:
      max_cycles:
        description: '最大サイクル数（空白=無限）'
        required: false
  
  schedule:
    - cron: '0 */6 * * *'  # 6時間ごと

permissions:
  contents: write
  issues: write

jobs:
  autonomous_development:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 チェックアウト
        uses: actions/checkout@v3
      
      - name: 🐍 Python環境セットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: 📦 依存関係インストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🚀 24時間自律システム v25起動
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/autonomous_24h_loop_v25.py
      
      - name: 📊 結果コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "🤖 自律開発サイクル v25完了 $(date '+%Y-%m-%d %H:%M')"
          git push
